<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IT Ticket Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: transparent;
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .gap-1\.25 {
        gap: 5px !important;
      }
      .card-fixed-width {
        width: 140px;
        min-width: 140px;
        max-width: 140px;
        cursor: pointer;
      }
      .card-text {
        max-width: 100%;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-thumb {
        background-color: rgba(0, 0, 0, 0.2);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      canvas {
        max-height: 240px;
      }
      #districtChart.hidden,
      #branchChart.hidden {
        display: none !important;
      }
    </style>
  </head>
  <body class="bg-transparent">
    <header
      class="p-4 pt-6 pb-4 w-full max-w-screen-xl mx-auto sticky top-0 z-50 bg-white border-b border-gray-200"
    >
      <div class="flex items-center justify-between">
        <h1
          id="mainHeading"
          class="text-3xl font-light text-gray-900 select-none"
        >
          IT Ticket Dashboard - <span id="viewMode">District Wise</span>
        </h1>
      </div>
      <div
        id="districtStatus"
        class="hidden mt-2 inline-block px-3 py-1 bg-yellow-100 text-yellow-800 border border-yellow-300 text-sm rounded-full font-medium"
      ></div>
      <div class="max-w-md w-full mt-4">
        <input
          id="searchInput"
          type="search"
          placeholder="Search districts or branches..."
          class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-black text-gray-700"
        />
      </div>
    </header>

    <main
      class="flex-grow w-full max-w-screen-xl mx-auto px-4 pb-8 flex flex-col"
    >
      <div id="loadingSpinner" class="text-center py-4 text-gray-500 hidden">
        Loading...
      </div>
      <section
        id="districtsSection"
        class="mt-6 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-1.25 justify-center"
      ></section>
      <canvas id="districtChart" class="mt-6 hidden"></canvas>

      <section id="branchesSection" class="mt-8 hidden w-full">
        <div class="flex items-center justify-between mb-4">
          <button
            id="backToDistrictsBtn"
            class="px-5 py-2 bg-black text-white rounded-lg shadow-sm text-sm flex items-center"
          >
            <i class="fas fa-arrow-left mr-2"></i>Back to Districts
          </button>
          <h2
            id="branchesTitle"
            class="text-xl font-light text-gray-900 truncate max-w-[calc(100%-140px)]"
          ></h2>
        </div>
        <div
          id="branchesGrid"
          class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-1.25 justify-center"
        ></div>
        <canvas id="branchChart" class="mt-6 hidden"></canvas>
      </section>
    </main>

    <script>
      let data = [];
      let currentDistrict = null;
      let districtChartInstance = null;
      let branchChartInstance = null;

      const districtsSection = document.getElementById("districtsSection");
      const branchesSection = document.getElementById("branchesSection");
      const branchesGrid = document.getElementById("branchesGrid");
      const branchesTitle = document.getElementById("branchesTitle");
      const backToDistrictsBtn = document.getElementById("backToDistrictsBtn");
      const searchInput = document.getElementById("searchInput");
      const viewModeText = document.getElementById("viewMode");
      const districtStatus = document.getElementById("districtStatus");
      const districtChart = document.getElementById("districtChart");
      const branchChart = document.getElementById("branchChart");
      const loadingSpinner = document.getElementById("loadingSpinner");
      // ✅ Restore selected district from previous page
      const savedDistrict = sessionStorage.getItem("selectedDistrict");
      if (savedDistrict) {
        currentDistrict = savedDistrict;
        window.addEventListener("load", () => {
          fetchDistrictData().then(() => {
            const district = data.find((d) => d.district === savedDistrict);
            if (district) showBranches(savedDistrict);
          });
        });
      }

      window.onload = () => searchInput.focus();

      async function fetchDistrictData() {
        try {
          loadingSpinner.classList.remove("hidden");
          const res = await fetch(
            "/api/method/sahayog_ticket.sahayog_ticket.doctype.sahayog_ticket.sahayog_ticket.get_it_tickets"
          );
          const result = await res.json();
          data = result.message || [];
          data.sort((a, b) => b.pending - a.pending);
          // Calculate total pending tickets across all districts
          let totalTickets = data.reduce((sum, d) => sum + (d.pending || 0), 0);

          // Update heading with total
          const mainHeading = document.getElementById("mainHeading");
          mainHeading.innerHTML = `
    IT Ticket Dashboard - <span id="viewMode">District Wise</span>
    <span class="text-lg text-gray-500 ml-4">(Total: ${totalTickets})</span>
`;

          renderDistricts();
        } catch (err) {
          console.error("Failed to fetch ticket data:", err);
        } finally {
          loadingSpinner.classList.add("hidden");
        }
      }

      fetchDistrictData();

      function createCard(name, count, onClick) {
        const card = document.createElement("div");
        card.className =
          "card-fixed-width bg-white rounded-xl border border-gray-200 shadow-sm hover:shadow-md p-4 text-center flex flex-col items-center justify-center select-none";
        card.innerHTML = `<p class="text-gray-900 font-semibold card-text" title="${name}">${name}</p><p class="text-red-600 text-lg font-bold">${count}</p>`;
        card.addEventListener("click", onClick);
        return card;
      }

      function renderDistricts(filter = "") {
        districtsSection.innerHTML = "";
        const filtered = data.filter(
          (d) =>
            d.district &&
            d.district.toLowerCase().includes(filter.toLowerCase())
        );

        if (filtered.length === 0) {
          districtsSection.innerHTML =
            '<p class="text-gray-500 col-span-full text-center py-8">No districts found.</p>';
          districtChart.classList.add("hidden");
          return;
        }

        filtered.forEach(({ district, pending }) => {
          const card = createCard(district, pending, () =>
            showBranches(district)
          );
          districtsSection.appendChild(card);
        });

        renderDistrictChart(filtered);
        districtChart.classList.remove("hidden");
        branchChart.classList.add("hidden");
      }

      function renderBranches(branches, filter = "") {
        branchesGrid.innerHTML = "";
        const filtered = branches
          .filter(
            (b) => b.name && b.name.toLowerCase().includes(filter.toLowerCase())
          )
          .sort((a, b) => b.pending - a.pending);

        if (filtered.length === 0) {
          branchesGrid.innerHTML =
            '<p class="text-gray-500 col-span-full text-center py-8">No branches found.</p>';
          branchChart.classList.add("hidden");
          return;
        }

        filtered.forEach(({ name, pending }) => {
          const card = createCard(name, pending, () => {
            const url = new URL("/app/sahayog-ticket", window.location.origin);

            url.searchParams.set(
              "status",
              JSON.stringify(["in", ["Open", "In-Progress", null]])
            );
            url.searchParams.set(
              "branch",
              JSON.stringify(["Equals", name])
            );
            url.searchParams.set(
              "district",
              JSON.stringify(["Equals", currentDistrict])
            ); // ✅ Correct field
            url.searchParams.set("dept_name", JSON.stringify(["Equals", "IT"]));

            console.log("Redirecting →", url.toString());
            window.top.location.href = url.toString();
          });

          branchesGrid.appendChild(card);
        });

        renderBranchChart(filtered);
        branchChart.classList.remove("hidden");
        districtChart.classList.add("hidden");
      }

      function showBranches(districtName) {
        sessionStorage.setItem("selectedDistrict", districtName);
        const district = data.find((d) => d.district === districtName);
        if (!district) return;
        currentDistrict = districtName;
        branchesTitle.textContent = `Branches in ${districtName}`;
        renderBranches(district.branches);
        branchesSection.classList.remove("hidden");
        districtsSection.classList.add("hidden");
        viewModeText.textContent = "Branch Wise";
        districtStatus.textContent = `Showing ${districtName} Pending Tickets`;
        districtStatus.classList.remove("hidden");
        districtChart.classList.add("hidden");
        searchInput.value = "";
      }

      function showDistricts() {
        sessionStorage.removeItem("selectedDistrict");
        currentDistrict = null;
        branchesSection.classList.add("hidden");
        districtsSection.classList.remove("hidden");
        viewModeText.textContent = "District Wise";
        districtStatus.classList.add("hidden");
        districtChart.classList.remove("hidden");
        branchChart.classList.add("hidden");
        renderDistricts();
        searchInput.value = "";
      }

      let debounce;
      searchInput.oninput = () => {
        clearTimeout(debounce);
        debounce = setTimeout(() => {
          const q = searchInput.value.trim();
          if (!currentDistrict) renderDistricts(q);
          else {
            const district = data.find((d) => d.district === currentDistrict);
            if (district) renderBranches(district.branches, q);
          }
        }, 300);
      };

      function renderDistrictChart(districtData) {
        const ctx = districtChart.getContext("2d");
        const labels = districtData.map((d) => d.district);
        const counts = districtData.map((d) => d.pending);

        if (districtChartInstance) districtChartInstance.destroy();
        districtChartInstance = new Chart(ctx, {
          type: "bar",
          data: {
            labels,
            datasets: [
              {
                label: "Pending Tickets",
                data: counts,
                backgroundColor: "#f87171",
              },
            ],
          },
          options: {
            responsive: true,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: (ctx) => `Pending: ${ctx.raw}`,
                },
              },
            },
            indexAxis: "x",
            animation: {
              duration: 800,
              easing: "easeOutBounce",
            },
            scales: {
              x: {
                ticks: { autoSkip: false, maxRotation: 90, minRotation: 45 },
              },
            },
          },
        });
      }

      function renderBranchChart(branchData) {
        const ctx = branchChart.getContext("2d");
        const labels = branchData.map((b) => b.name);
        const counts = branchData.map((b) => b.pending);

        if (branchChartInstance) branchChartInstance.destroy();
        branchChartInstance = new Chart(ctx, {
          type: "bar",
          data: {
            labels,
            datasets: [
              {
                label: "Pending Tickets",
                data: counts,
                backgroundColor: "#60a5fa",
              },
            ],
          },
          options: {
            responsive: true,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: (ctx) => `Pending: ${ctx.raw}`,
                },
              },
            },
            indexAxis: "x",
            animation: {
              duration: 800,
              easing: "easeOutBounce",
            },
            scales: {
              x: {
                ticks: { autoSkip: false, maxRotation: 90, minRotation: 45 },
              },
            },
          },
        });
      }

      backToDistrictsBtn.onclick = showDistricts;
    </script>
  </body>
</html>
